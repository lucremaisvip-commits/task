<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Notificações - Admin</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --warning: #f59e0b;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: var(--accent);
            border-bottom: 2px solid var(--card);
            padding-bottom: 10px;
        }

        .card {
            background-color: var(--card);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text);
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .badge-warning {
            background-color: var(--warning);
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #334155;
        }

        th {
            color: var(--text-muted);
        }

        .btn-action {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        #log-status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📢 Central de Notificações & Suporte</h1>

    <!-- AUTENTICAÇÃO CHAVE ADMIN -->
    <div class="card">
        <label for="adminKey">🔑 Chave de Ação Administrativa (ADMIN_KEY)</label>
        <input type="password" id="adminKey" placeholder="Insira sua ADMIN_KEY para autorizar os envios">
    </div>

    <!-- MENSAGEM DIRETA POR TELEGRAM ID -->
    <div class="card">
        <h3>💬 Enviar Mensagem Direta por ID</h3>
        <label for="targetId">Telegram ID do Destinatário</label>
        <input type="text" id="targetId" placeholder="Ex: 8608873220">

        <label for="directMessage">Conteúdo da Mensagem</label>
        <textarea id="directMessage" rows="4" placeholder="Digite aqui a mensagem que o usuário receberá via bot..."></textarea>

        <button onclick="sendDirectMessage()">🚀 Enviar Notificação</button>
    </div>

    <!-- LISTA DE SAQUES "AGUARDANDO CHAT" -->
    <div class="card">
        <h3>⏳ Saques Pendentes (Aguardando Chat)</h3>
        <button onclick="fetchPendingWithdrawals()">🔄 Atualizar Lista de Saques</button>
        
        <table id="withdrawalsTable">
            <thead>
                <tr>
                    <th>ID Saque</th>
                    <th>Telegram ID</th>
                    <th>Valor (R$)</th>
                    <th>Chave Pix</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="withdrawalsBody">
                <tr>
                    <td colspan="5" style="text-align: center; color: var(--text-muted);">
                        Clique em "Atualizar Lista" para carregar os saques pendentes.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="log-status"></div>
</div>

<script>
    const API_URL = "https://task-test-nrdn.onrender.com"; // Ajuste para a URL oficial da API do seu bot

    // Enviar mensagem direta para um Telegram ID específico
    async function sendDirectMessage() {
        const adminKey = document.getElementById('adminKey').value;
        const targetId = document.getElementById('targetId').value;
        const message = document.getElementById('directMessage').value;

        if (!adminKey || !targetId || !message) {
            showStatus('Preencha a ADMIN_KEY, o Telegram ID e a Mensagem!', 'warning');
            return;
        }

        try {
            const response = await fetch(`${API_URL}/api/admin/notify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey, telegramId: targetId, message })
            });

            const data = await response.json();
            if (response.ok && data.success) {
                showStatus(`✅ Mensagem enviada com sucesso para ${targetId}!`, 'success');
                document.getElementById('directMessage').value = '';
            } else {
                showStatus(`❌ Erro: ${data.message || 'Falha ao enviar mensagem.'}`, 'warning');
            }
        } catch (error) {
            showStatus(`❌ Erro de conexão com o servidor.`, 'warning');
        }
    }

    // Buscar saques com status 'Aguardando Chat'
    async function fetchPendingWithdrawals() {
        const adminKey = document.getElementById('adminKey').value;
        if (!adminKey) {
            showStatus('Insira a ADMIN_KEY para carregar a lista.', 'warning');
            return;
        }

        try {
            const response = await fetch(`${API_URL}/api/admin/pending-withdrawals?adminKey=${adminKey}`);
            const data = await response.json();

            const tbody = document.getElementById('withdrawalsBody');
            tbody.innerHTML = '';

            if (data.withdrawals && data.withdrawals.length > 0) {
                data.withdrawals.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${item.id}</td>
                        <td>${item.telegram_id}</td>
                        <td>R$ ${parseFloat(item.valor_solicitado).toFixed(2)}</td>
                        <td>${item.chave_pix}</td>
                        <td>
                            <button class="btn-action" onclick="quickNotify('${item.telegram_id}', '${item.id}')">
                                📩 Chamar no Bot
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Nenhum saque em 'Aguardando Chat' encontrado.</td></tr>`;
            }
        } catch (error) {
            showStatus('❌ Erro ao buscar saques pendentes.', 'warning');
        }
    }

    // Preenche os campos para chamar o usuário do saque com um modelo pré-pronto
    function quickNotify(telegramId, saqueId) {
        document.getElementById('targetId').value = telegramId;
        document.getElementById('directMessage').value = `Olá! Identificamos a sua solicitação de saque #${saqueId}. Por favor, confirme seu e-mail e chave Pix para darmos andamento ao seu pagamento no CashTaskBot!`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showStatus(text, type) {
        const log = document.getElementById('log-status');
        log.style.display = 'block';
        log.style.backgroundColor = type === 'success' ? '#064e3b' : '#7f1d1d';
        log.style.color = '#fff';
        log.innerHTML = text;
    }
</script>

</body>
</html>
