<script>

let userLang = "en";

// 🔐 SISTEMA DE SEGURANÇA E VALIDAÇÃO DE SESSÃO
function validarSessaoOuBloquear() {
  const urlParams = new URLSearchParams(window.location.search);
  let id = urlParams.get("id") || window.Telegram?.WebApp?.initDataUnsafe?.user?.id || localStorage.getItem("telegram_id");
  
  if (!id) {
    document.body.innerHTML = `<div style="color: #ff4444; padding: 50px; text-align: center; font-family: sans-serif;">
      <h2>❌ Acesso Negado</h2>
      <p>Esta aplicação deve ser aberta exclusivamente através do Telegram.</p>
    </div>`;
    throw new Error("Sessão não autorizada.");
  }
  return String(id);
}

// 🛡️ REQUISIÇÃO SEGURA COM TIMEOUT (ABORT CONTROLLER)
async function requisicaoSegura(url, options = {}, timeoutMs = 10000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(timer);
    return res;
  } catch (err) {
    clearTimeout(timer);
    throw err;
  }
}

function formatarTitulo(tituloCompleto, lang) {
    if (!tituloCompleto) return "";
    const partes = tituloCompleto.split(' / ');
    return (lang === 'pt') ? partes[0] : (partes[1] || partes[0]);
}

document.addEventListener("DOMContentLoaded", () => {

    if (currentHref) {
      let baseHref = currentHref.split("?")[0];
      link.href = `${baseHref}?id=${telegram_id}&lang=${userLang}`;
    }
    if (currentHref && currentHref.startsWith("tarefas.html")) {
      link.classList.add("active");
    } else {

    }

// 📥 CARREGAR TAREFAS DINÂMICAS (COMUNS E CRIADAS POR USUÁRIOS)
async function carregarTarefas() {
  const container = document.getElementById("tarefas");
  const cardExtra = document.getElementById("extraAdsCard");
  const t = linguagens[userLang];

  try {
    const res = await requisicaoSegura(`/api/tarefas?telegram_id=${telegram_id}`);
    const data = await res.json();

    if (!res.ok) {
      container.innerHTML = t.apiError;
      cardExtra.style.display = "none";
      return;
    }

    usuarioVip = data.vip || false;
    document.getElementById("info").innerText = usuarioVip ? t.vipUser : t.regularUser;

    container.innerHTML = "";

    const grupoAtivo = data.grupo_ativo || (new Date().getDay() + 1);

    let lista = data.tarefas.filter(task => {
      if (task.concluida) return false;
      if (task.grupo_rotacao) return Number(task.grupo_rotacao) === Number(grupoAtivo);
      return true;
    });

    if (lista.length === 0) {
      container.innerHTML = t.noTasks;
      cardExtra.style.display = "block";
      return;
    } else {
      cardExtra.style.display = "none";
    }

    lista.sort((a, b) => {
      const aVip = a.is_vip ? 1 : 0;
      const bVip = b.is_vip ? 1 : 0;
      return bVip - aVip;
    });

    lista = lista.slice(0, 6);

    lista.forEach(task => {
      const el = document.createElement("div");
      el.className = task.is_vip ? "tarefa vip-task" : "tarefa";
      const grupoRotacao = task.grupo_rotacao ? ` <span class="badge-grupo">Grupo ${task.grupo_rotacao}</span>` : '';
      const badgeUsuario = task.criado_por_usuario ? ` <span class="badge-usuario">${t.userBadge}</span>` : '';

      el.innerHTML = `
        ${task.is_vip ? `<span class="badge-vip">${t.vipBadge}</span>` : ''}
        <strong>${formatarTitulo(task.titulo, userLang)}</strong>${grupoRotacao}${badgeUsuario}<br>
        ⭐ ${task.pontos} ${t.pointsWord}<br>
        <button onclick="executarTarefa('${encodeURIComponent(task.link)}', ${task.id})">
          ${usuarioVip ? t.btnVipTask : t.btnRegularTask}
        </button>
      `;
      container.appendChild(el);
    });

  } catch (err) {
    container.innerHTML = t.connError;
    cardExtra.style.display = "none";
  }
}

// 🎯 EXECUTAR TAREFA
async function executarTarefa(link, tarefa_id) {
  const fingerprint = navigator.userAgent;
  const t = linguagens[userLang];

  try {
    const initRes = await requisicaoSegura("/api/iniciar-tarefa", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ telegram_id, tarefa_id, fingerprint })
    });

    const initData = await initRes.json();

    if (!initData.token) {
      alert(t.initTaskError);
      return;
    }

    const token = initData.token;

    if (usuarioVip) {
      window.open(decodeURIComponent(link), "_blank", "noopener,noreferrer");
      setTimeout(() => {
        concluirTarefa(tarefa_id, token, fingerprint);
      }, 16000);
      return;
    }

    const painel = `/ads-panel.html?tarefa_id=${tarefa_id}&token=${token}&link=${link}&id=${telegram_id}&lang=${userLang}&t=${Date.now()}`;
    window.open(painel, "_blank", "noopener,noreferrer");

  } catch (err) {
    alert(t.execTaskError);
  }
}

// ✅ CONCLUIR TAREFA
async function concluirTarefa(tarefa_id, token, fingerprint) {
  try {
    const res = await requisicaoSegura("/api/concluir-tarefa", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ telegram_id, tarefa_id, token, fingerprint })
    });

    const data = await res.json();
    alert(data.mensagem || data.erro);
    carregarTarefas();
  } catch (e) {
    console.error(e);
  }
}

// 📺 ASSISTIR ANÚNCIO EXTRA (SDK NATIVO)
async function assistirAnuncioExtra() {
  const t = linguagens[userLang];
  
  if (typeof show_11315704 !== "function") {
    alert(t.sdkError);
    return;
  }

  try {
    show_11315704().then(async () => {
      const res = await requisicaoSegura("/api/concluir-anuncio-extra", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telegram_id })
      });

      const data = await res.json();

      if (res.ok) {
        alert(data.mensagem || t.extraSuccess);
      } else {
        alert(data.erro || t.extraFail);
      }
    }).catch((err) => {
      console.log("Anúncio extra cancelado ou indisponível:", err);
    });
  } catch (err) {
    alert(t.extraFail);
  }
}

// 🚀 CRIAR CAMPANHA DE TAREFA POR PONTOS
async function criarCampanhaUsuario() {
  const t = linguagens[userLang];
  const titulo = document.getElementById("inputTaskTitle").value.trim();
  const link = document.getElementById("inputTaskLink").value.trim();
  const cliques = document.getElementById("selectTaskPkg").value;
  const statusEl = document.getElementById("statusCriacao");

  if (!titulo || !link) {
    alert(t.errFillAll);
    return;
  }

  statusEl.style.color = "#ff9f43";
  statusEl.innerText = userLang === "pt" ? "Processando campanha..." : "Processing campaign...";

  try {
    const res = await requisicaoSegura("/api/criar-campanha-usuario", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ telegram_id, titulo, link, cliques_totais: cliques, lang: userLang })
    });

    const data = await res.json();

    if (data.success) {
      statusEl.style.color = "#00ff88";
      statusEl.innerText = data.mensagem || t.successCamp;
      document.getElementById("inputTaskTitle").value = "";
      document.getElementById("inputTaskLink").value = "";
    } else {
      statusEl.style.color = "#ef4444";
      statusEl.innerText = "❌ " + (data.error || "Error");
    }
  } catch (err) {
    statusEl.style.color = "#ef4444";
    statusEl.innerText = "❌ Connection error.";
  }
}
